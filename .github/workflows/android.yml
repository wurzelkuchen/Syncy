# Android CI
# Added workflow_dispatch so this can be started manually from the GitHub Actions web UI.
# The manual run accepts an optional 'gradle_task' input (default: 'build').

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allow manual runs from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle task to run (examples: build, assembleDebug, test)'
        required: false
        default: 'build'

jobs:
  build:

    runs-on: ubuntu-latest

    # Use the provided manual input if present, otherwise default to 'build'
    env:
      GRADLE_TASK: ${{ github.event.inputs.gradle_task || 'build' }}

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew $GRADLE_TASK
